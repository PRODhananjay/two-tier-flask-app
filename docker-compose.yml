services:
  mysql:
    image: mysql:8
    container_name: MySQL
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: mydb
      MYSQL_USER: admin
      MYSQL_PASSWORD: admin
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - twotier
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot123"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: always

  flask-app:
    image: titanboi/my-flask-app:latest
    container_name: my-flask-app
    ports:
      - "5000:5000"
    environment:
      MYSQL_HOST: mysql
      MYSQL_USER: admin
      MYSQL_PASSWORD: admin
      MYSQL_DB: mydb
    networks:
      - twotier
    depends_on:
      mysql:
        condition: service_healthy
    restart: always

volumes:
  mysql-data:

networks:
  twotier:
    name: twotier
    driver: bridge
